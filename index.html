const KEY='our-finances-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{items:[],fund:0,goal:1000,split:20,extra:0,stopAtGoal:true}}catch{db={items:[],fund:0,goal:1000,split:20,extra:0}};db.items||=[];if(!Number.isFinite(+db.startingDebt)||+db.startingDebt<0)db.startingDebt=db.items.filter(x=>x.type==='debt').reduce((sum,x)=>sum+Math.max(0,+x.balance||0),0);const editForm=document.getElementById('editForm'),editor=document.getElementById('editor'),formTitle=document.getElementById('formTitle');let page='home';const PAGES=new Set(['home','plan','bills','timeline','fund','balances','settings']);const money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(db));render();return true}catch(e){alert('Could not save on this device. Check Safari storage settings.');return false}}function debts(){return db.items.filter(x=>x.type==='debt')}function total(){return debts().reduce((s,x)=>s+Number(x.balance||0),0)}function balanceMarkup(x){let v=money(x.balance);if(!x.isCreditCard||!(Number(x.creditLimit)>0))return v;return '<strong style="color:'+(Number(x.balance)>Number(x.creditLimit)?'#b91c1c':'#167347')+';font-weight:800">'+v+'</strong>'}function creditDetail(x){return x.isCreditCard&&Number(x.creditLimit)>0?'<small style="display:block;margin-top:3px">Credit limit is '+money(x.creditLimit)+'</small>':''}function show(p){if(!PAGES.has(p))p='home';page=p;render();window.scrollTo(0,0)}function syncTypeFields(){let isDebt=editForm.elements['type'].value==='debt',isCard=isDebt&&editForm.elements['isCreditCard'].value==='true';document.getElementById('creditCardLabel').hidden=!isDebt;document.getElementById('creditLimitLabel').hidden=!isCard;editForm.elements['creditLimit'].disabled=!isCard;for(let k of ['balance','apr','annualFee','feeMonth','monthlyFee']){let field=editForm.ele function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='our-finances-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(file){if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.items))throw Error('Invalid backup');if(confirm('Replace all data on this device?')){db=d;save()}}catch(e){alert('Could not import: '+e.message)}}render();
</script></html>
