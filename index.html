<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Finances</title>
<style>
:root{font-family:Arial,system-ui,sans-serif;color:#093944;background:#fbf4e9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 30% 100%,#f0dcc3 0%,transparent 38%),#fbf4e9;color:#093944}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;background:#087d83;color:white}button.alt{background:#d1eae5;color:#0c4b52}button:focus-visible{outline:3px solid #a97538;outline-offset:3px}
header{height:118px;position:relative;overflow:hidden;padding:5px 3%;background:linear-gradient(105deg,#fff8e9 0%,#b7e1d9 34%,#12818a 69%,#003b45 100%);color:#063d45}
header:before{content:"";position:absolute;bottom:3px;left:-3%;width:110%;height:43px;background:linear-gradient(172deg,transparent 39%,#128d94 40%,#4daaa5 56%,#e9c39d 57%,#ffe3bf 72%,#fff3df 73%);clip-path:polygon(0 40%,16% 80%,37% 28%,56% 5%,73% 75%,90% 38%,100% 55%,100% 100%,0 100%);opacity:.95}
header:after{content:"";position:absolute;bottom:0;left:0;width:100%;height:10px;background:#f8f0e5;clip-path:polygon(0 25%,20% 65%,45% 10%,70% 70%,100% 15%,100% 100%,0 100%)}
.brand{display:flex;align-items:center;gap:16px;position:relative;z-index:1}.palm{font-size:54px;line-height:1;filter:drop-shadow(1px 2px 1px #144e4c55)}.brand h1{font:700 clamp(27px,4vw,44px)/1 Georgia,serif;margin:0}.brand p{font-size:21px;margin:4px 0}.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;position:relative;z-index:1}.headlinks{display:flex;align-items:center;gap:13px;margin-top:16px}.headlinks button{color:white;background:transparent;font-size:19px;padding:8px}.headlinks .separator{border-left:2px solid #f9f1e7;height:27px}
main{max-width:1220px;margin:auto;padding:12px 16px 110px;position:relative}
main:after{content:"";pointer-events:none;position:absolute;left:-5%;right:-5%;bottom:0;height:105px;background:linear-gradient(169deg,transparent 0 28%,#ecd6ba 29% 39%,#f7e5cf 40% 49%,#8fc9c5 50% 58%,#16999b 60% 80%,#087a85 81%);opacity:.65}
.card{background:linear-gradient(135deg,#fffdfa,#fff8f1);border:1px solid #eadac8;border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 6px 18px #62452622}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}.cards .card{margin:0;border-radius:0;border-right:1px solid #d5c3ad;box-shadow:none}.cards .card:first-child{border-radius:25px 0 0 25px}.cards .card:last-child{border-radius:0 25px 25px 0;border-right:0}
.summary{border-radius:26px;overflow:hidden;box-shadow:0 6px 18px #604b3d22;border:1px solid #eadccf;margin-bottom:22px;background:#fff9f2}.summary .card{border-top:0;border-bottom:0}.metric{font:bold clamp(22px,3vw,42px)/1.25 Georgia,serif;color:#063f4b}.muted{color:#395960}.summary-label{font-weight:700;font-size:clamp(14px,1.7vw,19px);margin-bottom:10px}.summary-icon{font-size:30px;color:#b77e3e;margin-bottom:6px}.summary .card:last-child{text-align:left}.donut{width:100px;height:100px;border-radius:50%;margin:auto;background:conic-gradient(#07898b var(--pct),#edd6b9 0);display:grid;place-items:center}.donut>span{width:74px;height:74px;border-radius:50%;background:#fff8f0;display:flex;flex-direction:column;justify-content:center;font-size:27px;font-weight:800}.donut small{font-size:12px;font-weight:400}
.heroactions{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:20px 0}.heroactions button{min-height:128px;border-radius:25px;font:bold clamp(18px,2.5vw,29px) Georgia,serif;color:#0b4449;border:1px solid #d6c6b3;box-shadow:inset 0 1px #fff8,0 4px 12px #654e3620}.heroactions button:nth-child(1){background:linear-gradient(130deg,#bce3d9,#7fc4b8)}.heroactions button:nth-child(2){background:linear-gradient(130deg,#f6d5b2,#dda36c);color:#fff}.heroactions button:nth-child(3){background:linear-gradient(130deg,#72c5c2,#00838b);color:#fff}.heroactions .actionicon{display:block;font-size:36px;margin-bottom:8px}.heroactions small{display:block;font:600 15px Arial,sans-serif;margin-top:4px}
nav{display:flex;gap:4px;align-items:center;justify-content:space-between;background:#fffcf7;border:1px solid #e7d8c9;box-shadow:0 4px 12px #70533322;border-radius:28px;padding:6px;margin:18px 0}nav button,nav button.alt{flex:1;border-radius:23px;background:transparent;color:#073e48;padding:12px 8px;font-size:clamp(13px,1.8vw,20px);white-space:nowrap}nav button.selected{background:linear-gradient(120deg,#146d7b,#003e4c);color:white}nav button .navico{font-size:22px;margin-right:8px}
.homegrid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}.homegrid .card{margin:0 0 16px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.heading{font:700 clamp(24px,3vw,35px) Georgia,serif;margin:0 0 4px}.sectionico{font-size:34px;margin-right:12px;color:#b58145}.line{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #e1d7c9}.line:last-child{border-bottom:0}.line strong{display:block;font-size:18px}.line small{display:block;margin-top:4px;color:#365b5c}.amount{text-align:right;white-space:nowrap;font-size:22px;font-weight:800}.rank{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#e5b57e;color:#69411b;margin-right:10px;font-weight:800;font-size:19px}.debtname{display:flex;align-items:center}.fullbtn{width:100%;margin-top:12px;background:linear-gradient(100deg,#f5d8b8,#e5ae7b);color:#75431b;font:bold 20px Georgia,serif}.fullbtn.sea{background:linear-gradient(100deg,#c0e5dd,#95d1c7);color:#104a50}.progress{height:16px;background:#b6dcd3;border-radius:20px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#009b9d,#006774);border-radius:20px}.pill{background:#bde4c6;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:bold}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 5px;border-bottom:1px solid #e4eae7}td button{padding:7px 9px}input,select{padding:11px;border:1px solid #aecbc7;border-radius:10px;width:100%;background:white}label{display:block;margin:10px 0;font-weight:600}label input,label select{display:block;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}dialog{border:0;border-radius:20px;width:min(95vw,490px);box-shadow:0 20px 90px #0004}dialog::backdrop{background:#183f4677}small{color:#5d7777}
@media(max-width:760px){header{height:110px}.brand h1{font-size:30px}.brand p{font-size:16px}.palm{font-size:40px}.headlinks button{font-size:14px;padding:5px}.cards{grid-template-columns:repeat(2,1fr)}.cards .card:first-child,.cards .card:last-child{border-radius:0}.summary{border-radius:20px}.summary .card:nth-child(2){border-right:0}.summary .card:nth-child(-n+2){border-bottom:1px solid #e6d6c2}.homegrid{grid-template-columns:1fr}.heroactions button{min-height:105px;font-size:17px}.heroactions .actionicon{font-size:27px}nav{overflow:auto;justify-content:flex-start}nav button{min-width:max-content}.amount{font-size:18px}}
@media(max-width:420px){main{padding:10px}.heroactions{gap:6px}.heroactions button{font-size:14px;padding:8px 5px}.heroactions small{font-size:11px}.brand h1{font-size:25px}.headlinks{gap:4px}.headlinks button{font-size:12px}.summary .card{padding:14px}.heading{font-size:25px}}
.reverse-debt-progress{margin:12px 0 20px;padding:14px 20px;background:#fffcf7;border:1px solid #e7d8c9;border-radius:18px;box-shadow:0 3px 10px #70533316}.reverse-progress-label{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px;font-size:15px}.reverse-progress-label span{color:#41666a}.reverse-progress-track{height:19px;border-radius:30px;overflow:hidden;background:#d9eae3}.reverse-progress-track>span{display:block;height:100%;background:linear-gradient(90deg,#0b777e,#3bb1ac);border-radius:30px;transition:width .3s ease}@media(max-width:500px){.reverse-progress-label{font-size:12px;flex-wrap:wrap}} </style>
<header><div class="headrow"><div class="brand"><span class="palm" aria-hidden="true">🌴</span><div><h1>Our Finances</h1><p>Jen &amp; Me</p></div></div><div class="headlinks"><button onclick="show('home')">⌂ Home</button><span class="separator"></span><button onclick="show('settings')">⚙ Settings</button></div></div></header>
<main><nav id="tabs"></nav><section id="screen"></section></main>
<dialog id="editor"><form id="editForm"><h2 id="formTitle">Add item</h2><input type="hidden" name="id"><label>Name<input name="name" required maxlength="80"></label><label>Type<select name="type"><option value="debt">Debt</option><option value="bill">Recurring bill</option></select></label><label>Monthly payment ($)<input name="payment" type="number" step=".01" min="0" required></label><label>Due day of month<input name="due" type="number" min="1" max="31" required></label><label>Remaining balance ($) — debts only<input name="balance" type="number" step=".01" min="0" value="0"></label><label>Interest APR (%) — debts only<input name="apr" type="number" step=".01" min="0" value="0"></label><label>Belongs to<select name="owner"><option>Joint</option><option>Mine</option><option>Jen's</option></select></label><div class="actions"><button type="submit">Save</button><button type="button" class="alt" onclick="editor.close()">Cancel</button></div></form></dialog>
<script>
const KEY='our-finances-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{items:[],fund:0,goal:1000,split:20,extra:0}}catch{db={items:[],fund:0,goal:1000,split:20,extra:0}};db.items||=[];let page='home';const money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function debts(){return db.items.filter(x=>x.type==='debt')}function total(){return debts().reduce((s,x)=>s+Number(x.balance||0),0)}function show(p){page=p;render()}function openEdit(id){let x=db.items.find(x=>x.id===id)||{id:'',name:'',type:'debt',payment:0,due:1,balance:0,apr:0,owner:'Joint'};for(let k of ['id','name','type','payment','due','balance','apr','owner'])editForm.elements[k].value=x[k];formTitle.textContent=id?'Edit item':'Add debt or bill';editor.showModal()}editForm.onsubmit=e=>{e.preventDefault();let f=editForm.elements;let x={id:f.id.value||String(Date.now()),name:f.name.value.trim(),type:f.type.value,payment:Math.max(0,+f.payment.value),due:Math.min(31,Math.max(1,+f.due.value)),balance:f.type.value==='debt'?Math.max(0,+f.balance.value):0,apr:f.type.value==='debt'?Math.max(0,+f.apr.value):0,owner:f.owner.value};db.items=db.items.filter(i=>i.id!==x.id);db.items.push(x);editor.close();save()};function del(id){if(confirm('Delete this item?')){db.items=db.items.filter(x=>x.id!==id);save()}}function updateBalance(id){let x=db.items.find(x=>x.id===id);let n=prompt('New remaining balance for '+x.name,x.balance);if(n!==null&&n.trim()!==''&&Number.isFinite(+n)&&+n>=0){x.balance=+n;save()}}function due(x){let d=new Date(),y=d.getFullYear(),m=d.getMonth(),day=Math.min(x.due,new Date(y,m+1,0).getDate());let out=new Date(y,m,day);if(out<new Date(y,m,d.getDate())){m++;out=new Date(y,m,Math.min(x.due,new Date(y,m+1,0).getDate()))}return out.toLocaleDateString(undefined,{month:'short',day:'numeric'})}function table(rows){return '<div class="card scroll"><table><thead><tr><th>Bill / debt</th><th>Due</th><th>Payment</th><th>Balance</th><th></th></tr></thead><tbody>'+rows.map(x=>'<tr><td><b>'+esc(x.name)+'</b><br><small>'+esc(x.owner)+' · '+(x.type==='debt'?'Debt':'Bill')+'</small></td><td>'+due(x)+'</td><td>'+money(x.payment)+'</td><td>'+(x.type==='debt'?money(x.balance):'—')+'</td><td><button class="alt" onclick="openEdit('+JSON.stringify(x.id)+')">Edit</button></td></tr>').join('')+'</tbody></table></div>'}function projection(){let ds=debts().filter(x=>x.balance>0).map(x=>({...x,balance:+x.balance,payment:+x.payment,apr:+x.apr}));let rows=[];let freed=debts().filter(x=>x.balance<=0).reduce((s,x)=>s+(+x.payment||0),0);let base=ds.reduce((s,x)=>s+x.payment,0);let month=0;while(ds.length&&month<600){month++;ds.sort((a,b)=>a.balance-b.balance);let cash=base+freed*(1-db.split/100)+(+db.extra||0);for(let x of ds)x.balance+=x.balance*x.apr/1200;for(let x of ds){let p=Math.min(x.balance,x.payment,cash);x.balance-=p;cash-=p}for(let x of ds){if(cash<=0)break;let p=Math.min(x.balance,cash);x.balance-=p;cash-=p}let done=ds.filter(x=>x.balance<.01);freed+=done.reduce((s,x)=>s+x.payment,0);ds=ds.filter(x=>x.balance>=.01);rows.push({month,remaining:ds.reduce((s,x)=>s+x.balance,0),paid:done.map(x=>x.name)});if(!done.length&&month>24&&rows.at(-1).remaining>=rows.at(-2).remaining)break}return rows}function render(){let labels=[['home','⌂','Overview'],['plan','▱','Debts (Snowball)'],['bills','▦','Monthly Bills'],['timeline','▥','Payoff Timeline']];document.getElementById('tabs').innerHTML=labels.map(([k,i,v])=>'<button class="'+(page===k?'selected':'')+'" onclick="show(\''+k+'\')"><span class="navico">'+i+'</span>'+v+'</button>').join('');let html='';if(page==='home'){let plan=projection(),date=plan.length&&plan.at(-1).remaining<.01?new Date(new Date().getFullYear(),new Date().getMonth()+plan.length,1).toLocaleDateString(undefined,{month:'short',year:'numeric'}):'—';let active=debts().filter(x=>x.balance>0).sort((a,b)=>a.balance-b.balance),first=active[0],firstPayoff=first?plan.find(x=>x.paid.includes(first.name)):null;let paid=debts().filter(x=>x.balance<=0).length,all=debts().length,percent=all?Math.round(paid/all*100):0;let upcoming=[...db.items].sort((a,b)=>a.due-b.due).slice(0,4);html='<div class="summary"><div class="cards"><div class="card"><div class="summary-icon">▱</div><div class="summary-label">Total Debt</div><div class="metric">'+money(total())+'</div></div><div class="card"><div class="summary-icon">≋</div><div class="summary-label">Extra to Snowball</div><div class="metric">'+money(db.extra)+'<small>/mo</small></div></div><div class="card"><div class="summary-icon">▦</div><div class="summary-label">Debt-Free By</div><div class="metric">'+date+'</div></div><div class="card"><div class="summary-icon">⚑</div><div class="summary-label">Emergency Fund</div><div class="metric">'+money(db.fund)+'</div><small>Goal '+money(db.goal)+'</small><div class="progress" style="height:9px;margin:9px 0"><span style="width:'+Math.min(100,db.goal?Math.round(db.fund/db.goal*100):0)+'%"></span></div><button class="alt" style="padding:6px 10px;font-size:13px" onclick="show(\'fund\')">Manage Fund</button></div></div></div><div class="reverse-debt-progress"><div class="reverse-progress-label"><strong>Debt Remaining</strong><span>'+(100-percent)+'% remaining · '+paid+' of '+all+' debts paid off</span></div><div class="reverse-progress-track" role="progressbar" aria-label="Debt remaining" aria-valuenow="'+(100-percent)+'" aria-valuemin="0" aria-valuemax="100"><span style="width:'+(100-percent)+'%"></span></div></div><div class="heroactions"><button onclick="show(\'balances\')"><span class="actionicon">✎</span>Update Balances<small>(Monthly)</small></button><button onclick="openEdit()"><span class="actionicon">⊕</span>Add Debt or Bill</button><button onclick="show(\'timeline\')"><span class="actionicon">▦</span>View Payoff Plan</button></div><div class="homegrid"><div><div class="card"><h2 class="heading"><span class="sectionico">≋</span>Debt Snowball</h2><p>Pay off debts from smallest to largest.</p>'+(active.length?active.slice(0,4).map((x,i)=>'<div class="line"><div><div class="debtname"><span class="rank">'+(i+1)+'</span><div><strong>'+esc(x.name)+'</strong>'+(i===0?'<span class="pill">First to Pay Off</span>':'')+'<small>'+money(x.payment)+'/mo · '+x.apr+'% APR</small></div></div></div><div class="amount">'+money(x.balance)+'</div></div>').join(''):'<p>No debts yet. Add a debt to begin your snowball.</p>')+'<button class="fullbtn" onclick="show(\'plan\')">View All Debts ('+active.length+') ❯</button></div></div><div><div class="card"><h2 class="heading"><span class="sectionico">▦</span>Monthly Bills</h2><p>Regular monthly and recurring payments.</p>'+(upcoming.length?upcoming.map(x=>'<div class="line"><div><strong>'+esc(x.name)+'</strong><small>Due '+due(x)+'</small></div><div class="amount">'+money(x.payment)+'</div></div>').join(''):'<p>No monthly bills added yet.</p>')+'<button class="fullbtn sea" onclick="show(\'bills\')">View All Bills ('+db.items.length+') ❯</button></div><div class="card" style="background:linear-gradient(110deg,#e4f1e9,#c8e6dd)"><h2 class="heading"><span class="sectionico">⚑</span>Next Milestone</h2><p>'+(first?'Pay off <b>'+esc(first.name)+'</b>'+(firstPayoff?' in <b>'+firstPayoff.month+' months</b>':'')+'!':'Add your first debt to see a milestone.')+'</p></div></div></div>'}else if(page==='timeline'){let p=projection();html='<div class="card"><h2>Payoff Timeline</h2><p>Estimated monthly payoff milestones based on current balances and payments.</p>'+(p.flatMap(x=>x.paid.map(n=>'<div class="line"><strong>'+esc(n)+'</strong><span>Month '+x.month+'</span></div>')).join('')||'<p>Add debts to see a payoff timeline.</p>')+'</div>'}else if(page==='balances'){html='<div class="card"><h2>Monthly balance updates</h2><p>Enter current remaining balances once each month. No payment history is stored.</p></div>'+debts().map(x=>'<div class="card"><b>'+esc(x.name)+'</b><p>Remaining: <strong>'+money(x.balance)+'</strong> · APR '+x.apr+'%</p><button onclick="updateBalance('+JSON.stringify(x.id)+')">Update balance</button> <button class="alt" onclick="openEdit('+JSON.stringify(x.id)+')">Edit details</button></div>').join('')+'<button onclick="openEdit()">Add debt</button>'}else if(page==='bills'){html='<div class="card"><h2>Monthly Bills</h2><p>Every recurring bill and debt has a due date and payment amount.</p><button onclick="openEdit()">Add bill or debt</button></div>'+table([...db.items].sort((a,b)=>a.due-b.due))}else if(page==='plan'){let plan=projection();html='<div class="card"><h2>Debt snowball</h2><p>Debts are targeted from smallest balance to largest. Paid-off payments are split between the next debt and your emergency fund.</p><p>Extra monthly snowball budget: '+money(db.extra)+' · Emergency fund share: '+db.split+'%</p></div><div class="card"><h3>Payoff priority</h3>'+debts().filter(x=>x.balance>0).sort((a,b)=>a.balance-b.balance).map((x,i)=>'<p><span class="pill">'+(i+1)+'</span> <b>'+esc(x.name)+'</b> — '+money(x.balance)+' at '+x.apr+'% APR</p>').join('')+'</div><div class="card"><h3>Projected milestones</h3>'+(plan.flatMap(x=>x.paid.map(n=>'<p>Month '+x.month+': '+esc(n)+' paid off</p>')).join('')||'Add debts to see a projection.')+'<small>Estimate only. Actual interest, due dates and creditor calculations may differ.</small></div>'}else if(page==='fund'){html='<div class="card"><h2>Emergency Fund</h2><p class="big">'+money(db.fund)+'</p><p>Goal: '+money(db.goal)+'</p><progress value="'+Math.min(db.fund,db.goal||1)+'" max="'+(db.goal||1)+'" style="width:100%"></progress><label>Actual fund balance ($)<input id="fundBalance" type="number" min="0" step=".01" value="'+db.fund+'"></label><label>Fund goal ($)<input id="fundGoal" type="number" min="0" step=".01" value="'+db.goal+'"></label><label>Share of each freed debt payment to emergency fund (%)<input id="fundSplit" type="number" min="0" max="100" value="'+db.split+'"></label><button onclick="db.fund=Math.max(0,+fundBalance.value);db.goal=Math.max(0,+fundGoal.value);db.split=Math.max(0,Math.min(100,+fundSplit.value));save()">Save fund settings</button></div>'}else if(page==='settings'){html='<div class="card"><h2>Settings</h2><label>Extra monthly snowball budget ($)<input id="extra" type="number" min="0" step=".01" value="'+db.extra+'"></label><button onclick="db.extra=Math.max(0,+extra.value);save()">Save</button></div><div class="card"><h2>Backup</h2><p>Information is saved only in this browser. Export to back up or move it to another device. It does not sync between phones yet.</p><div class="actions"><button onclick="backup()">Export JSON</button><label style="margin:0">Import JSON<input type="file" accept=".json,application/json" onchange="restore(this.files[0])"></label></div></div>'}document.getElementById('screen').innerHTML=html}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='our-finances-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(file){if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.items))throw Error('Invalid backup');if(confirm('Replace all data on this device?')){db=d;save()}}catch(e){alert('Could not import: '+e.message)}}render();
</script></html>
