<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Finances</title>
<style>:root{font-family:system-ui,Arial;background:#f7f2e8;color:#183f46}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#146c78,#42a5a6);color:white;padding:22px 5%}header h1{margin:0}header p{margin:4px 0}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:12px 16px;background:#176e79;color:white;cursor:pointer}button.alt{background:#e5f2ed;color:#175d65}button.danger{background:#a44545}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}main{max-width:1000px;margin:auto;padding:12px 18px 50px}.card{background:#fffefa;border:1px solid #d8e3de;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 12px #124c5810}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.cards .card{margin:0}.big{font-size:1.6rem;font-weight:750}.muted{color:#607b7c}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 5px;border-bottom:1px solid #e4eae7}td button{padding:7px 9px}input,select{padding:11px;border:1px solid #aecbc7;border-radius:10px;width:100%;background:white}label{display:block;margin:10px 0;font-weight:600}label input,label select{display:block;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}dialog{border:0;border-radius:20px;width:min(95vw,490px);box-shadow:0 20px 90px #0004}dialog::backdrop{background:#183f4677}.scroll{overflow:auto}.pill{background:#e7f1e9;border-radius:12px;padding:6px 10px;display:inline-block}small{color:#5d7777}@media(max-width:600px){th,td{font-size:13px}header{padding:18px}td button{font-size:12px}}.homegrid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}.homegrid .card{margin:0 0 14px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #e2ebe7}.line:last-child{border-bottom:0}.line strong{display:block}.line small{display:block;margin-top:3px}.metric{font-size:1.8rem;font-weight:750;margin-top:5px}.progress{height:12px;background:#e4eee9;border-radius:20px;overflow:hidden;margin:12px 0}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#1b7c89,#5bb4a9);border-radius:20px}.heading{font-size:1.15rem;margin:0 0 12px}.actionbtn{flex:1;min-width:150px;padding:16px}.linkbtn{padding:8px 12px;font-size:.9rem}.topnav{margin:18px 0 4px}@media(max-width:700px){.homegrid{grid-template-columns:1fr}.metric{font-size:1.5rem}} </style>
<header><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h1>Our Finances</h1><p>One plan. A calmer financial future.</p></div><div class="actions"><button class="alt" onclick="show('home')">Home</button><button class="alt" onclick="show('settings')">Settings</button></div></div></header>
<main><nav id="tabs"></nav><section id="screen"></section></main>
<dialog id="editor"><form id="editForm"><h2 id="formTitle">Add item</h2><input type="hidden" name="id"><label>Name<input name="name" required maxlength="80"></label><label>Type<select name="type"><option value="debt">Debt</option><option value="bill">Recurring bill</option></select></label><label>Monthly payment ($)<input name="payment" type="number" step=".01" min="0" required></label><label>Due day of month<input name="due" type="number" min="1" max="31" required></label><label>Remaining balance ($) — debts only<input name="balance" type="number" step=".01" min="0" value="0"></label><label>Interest APR (%) — debts only<input name="apr" type="number" step=".01" min="0" value="0"></label><label>Belongs to<select name="owner"><option>Joint</option><option>Mine</option><option>Jen's</option></select></label><div class="actions"><button type="submit">Save</button><button type="button" class="alt" onclick="editor.close()">Cancel</button></div></form></dialog>
<script>
const KEY='our-finances-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{items:[],fund:0,goal:1000,split:20,extra:0}}catch{db={items:[],fund:0,goal:1000,split:20,extra:0}};db.items||=[];let page='home';const money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function debts(){return db.items.filter(x=>x.type==='debt')}function total(){return debts().reduce((s,x)=>s+Number(x.balance||0),0)}function show(p){page=p;render()}function openEdit(id){let x=db.items.find(x=>x.id===id)||{id:'',name:'',type:'debt',payment:0,due:1,balance:0,apr:0,owner:'Joint'};for(let k of ['id','name','type','payment','due','balance','apr','owner'])editForm.elements[k].value=x[k];formTitle.textContent=id?'Edit item':'Add debt or bill';editor.showModal()}editForm.onsubmit=e=>{e.preventDefault();let f=editForm.elements;let x={id:f.id.value||String(Date.now()),name:f.name.value.trim(),type:f.type.value,payment:Math.max(0,+f.payment.value),due:Math.min(31,Math.max(1,+f.due.value)),balance:f.type.value==='debt'?Math.max(0,+f.balance.value):0,apr:f.type.value==='debt'?Math.max(0,+f.apr.value):0,owner:f.owner.value};db.items=db.items.filter(i=>i.id!==x.id);db.items.push(x);editor.close();save()};function del(id){if(confirm('Delete this item?')){db.items=db.items.filter(x=>x.id!==id);save()}}function updateBalance(id){let x=db.items.find(x=>x.id===id);let n=prompt('New remaining balance for '+x.name,x.balance);if(n!==null&&n.trim()!==''&&Number.isFinite(+n)&&+n>=0){x.balance=+n;save()}}function due(x){let d=new Date(),y=d.getFullYear(),m=d.getMonth(),day=Math.min(x.due,new Date(y,m+1,0).getDate());let out=new Date(y,m,day);if(out<new Date(y,m,d.getDate())){m++;out=new Date(y,m,Math.min(x.due,new Date(y,m+1,0).getDate()))}return out.toLocaleDateString(undefined,{month:'short',day:'numeric'})}function table(rows){return '<div class="card scroll"><table><thead><tr><th>Bill / debt</th><th>Due</th><th>Payment</th><th>Balance</th><th></th></tr></thead><tbody>'+rows.map(x=>'<tr><td><b>'+esc(x.name)+'</b><br><small>'+esc(x.owner)+' · '+(x.type==='debt'?'Debt':'Bill')+'</small></td><td>'+due(x)+'</td><td>'+money(x.payment)+'</td><td>'+(x.type==='debt'?money(x.balance):'—')+'</td><td><button class="alt" onclick="openEdit('+JSON.stringify(x.id)+')">Edit</button></td></tr>').join('')+'</tbody></table></div>'}function projection(){let ds=debts().filter(x=>x.balance>0).map(x=>({...x,balance:+x.balance,payment:+x.payment,apr:+x.apr}));let rows=[];let freed=debts().filter(x=>x.balance<=0).reduce((s,x)=>s+(+x.payment||0),0);let base=ds.reduce((s,x)=>s+x.payment,0);let month=0;while(ds.length&&month<600){month++;ds.sort((a,b)=>a.balance-b.balance);let cash=base+freed*(1-db.split/100)+(+db.extra||0);for(let x of ds)x.balance+=x.balance*x.apr/1200;for(let x of ds){let p=Math.min(x.balance,x.payment,cash);x.balance-=p;cash-=p}for(let x of ds){if(cash<=0)break;let p=Math.min(x.balance,cash);x.balance-=p;cash-=p}let done=ds.filter(x=>x.balance<.01);freed+=done.reduce((s,x)=>s+x.payment,0);ds=ds.filter(x=>x.balance>=.01);rows.push({month,remaining:ds.reduce((s,x)=>s+x.balance,0),paid:done.map(x=>x.name)});if(!done.length&&month>24&&rows.at(-1).remaining>=rows.at(-2).remaining)break}return rows}function render(){let labels=[['home','Overview'],['balances','Update Balances'],['bills','Monthly Bills'],['plan','Snowball Plan'],['fund','Emergency Fund']];tabs.innerHTML=labels.map(([k,v])=>'<button class="'+(page===k?'':'alt')+'" onclick="show(\''+k+'\')">'+v+'</button>').join('');let html='';if(page==='home'){let plan=projection(),date=plan.length&&plan.at(-1).remaining<.01?new Date(new Date().getFullYear(),new Date().getMonth()+plan.length,1).toLocaleDateString(undefined,{month:'short',year:'numeric'}):'Not estimated';let active=debts().filter(x=>x.balance>0).sort((a,b)=>a.balance-b.balance),first=active[0],firstPayoff=first?plan.find(x=>x.paid.includes(first.name)):null;let monthly=db.items.reduce((v,x)=>v+(+x.payment||0),0);let paid=debts().filter(x=>x.balance<=0).length;let all=debts().length;let percent=all?Math.round(paid/all*100):0;let upcoming=[...db.items].sort((a,b)=>a.due-b.due).slice(0,4);html='<div class="cards"><div class="card"><div class="muted">Total Debt</div><div class="metric">'+money(total())+'</div></div><div class="card"><div class="muted">Extra to Snowball</div><div class="metric">'+money(db.extra)+'</div><small>per month</small></div><div class="card"><div class="muted">Debt-Free By</div><div class="metric">'+date+'</div></div><div class="card"><div class="muted">Debts Paid Off</div><div class="metric">'+percent+'%</div><small>'+paid+' of '+all+' debts</small></div></div><div class="card"><div class="actions"><button class="actionbtn" onclick="show(\'balances\')">Update Balances (Monthly)</button><button class="actionbtn alt" onclick="openEdit()">Add Debt or Bill</button><button class="actionbtn alt" onclick="show(\'plan\')">View Payoff Plan</button></div></div><div class="homegrid"><div><div class="card"><div class="sectionhead"><h2 class="heading">Debt Snowball</h2><span class="pill">Smallest first</span></div><p class="muted">Pay off debts from smallest to largest.</p>'+(active.length?active.slice(0,4).map((x,i)=>'<div class="line"><div><strong>'+(i+1)+'. '+esc(x.name)+'</strong><small>'+x.apr+'% APR · '+money(x.payment)+'/mo</small></div><b>'+money(x.balance)+'</b></div>').join(''):'<p class="muted">No active debts yet. Add your first debt to get started.</p>')+(first?'<p><small>First to pay off</small><br><b>'+esc(first.name)+'</b>'+(firstPayoff?' · projected month '+firstPayoff.month:'')+'</p>':'')+'<button class="alt linkbtn" onclick="show(\'plan\')">View All Debts ('+active.length+')</button></div></div><div><div class="card"><div class="sectionhead"><h2 class="heading">Monthly Bills</h2><span class="pill">'+money(monthly)+'/mo</span></div>'+(upcoming.length?upcoming.map(x=>'<div class="line"><div><strong>'+esc(x.name)+'</strong><small>Due '+due(x)+'</small></div><b>'+money(x.payment)+'</b></div>').join(''):'<p class="muted">No bills yet. Add bills with due dates and payment amounts.</p>')+'<button class="alt linkbtn" onclick="show(\'bills\')">View All Bills ('+db.items.length+')</button></div><div class="card"><h2 class="heading">Next Milestone</h2>'+(first?'<p>Pay off <b>'+esc(first.name)+'</b>'+(firstPayoff?' in about '+firstPayoff.month+' month'+(firstPayoff.month===1?'':'s'):'')+'!</p>':'<p class="muted">Your first payoff milestone will appear here.</p>')+'<div class="progress"><span style="width:'+percent+'%"></span></div><small>'+paid+' of '+all+' debts paid off</small></div><div class="card"><div class="sectionhead"><h2 class="heading">Emergency Fund</h2><b>'+money(db.fund)+'</b></div><div class="progress"><span style="width:'+Math.min(100,db.goal?Math.round(db.fund/db.goal*100):0)+'%"></span></div><small>Goal '+money(db.goal)+' · '+db.split+'% of freed payments</small><p><button class="alt linkbtn" onclick="show(\'fund\')">Manage Fund</button></p></div></div></div>'}else if(page==='balances'){html='<div class="card"><h2>Monthly balance updates</h2><p>Enter current remaining balances once each month. No payment history is stored.</p></div>'+debts().map(x=>'<div class="card"><b>'+esc(x.name)+'</b><p>Remaining: <strong>'+money(x.balance)+'</strong> · APR '+x.apr+'%</p><button onclick="updateBalance('+JSON.stringify(x.id)+')">Update balance</button> <button class="alt" onclick="openEdit('+JSON.stringify(x.id)+')">Edit details</button></div>').join('')+'<button onclick="openEdit()">Add debt</button>'}else if(page==='bills'){html='<div class="card"><h2>Monthly Bills</h2><p>Every recurring bill and debt has a due date and payment amount.</p><button onclick="openEdit()">Add bill or debt</button></div>'+table([...db.items].sort((a,b)=>a.due-b.due))}else if(page==='plan'){let plan=projection();html='<div class="card"><h2>Debt snowball</h2><p>Debts are targeted from smallest balance to largest. Paid-off payments are split between the next debt and your emergency fund.</p><p>Extra monthly snowball budget: '+money(db.extra)+' · Emergency fund share: '+db.split+'%</p></div><div class="card"><h3>Payoff priority</h3>'+debts().filter(x=>x.balance>0).sort((a,b)=>a.balance-b.balance).map((x,i)=>'<p><span class="pill">'+(i+1)+'</span> <b>'+esc(x.name)+'</b> — '+money(x.balance)+' at '+x.apr+'% APR</p>').join('')+'</div><div class="card"><h3>Projected milestones</h3>'+(plan.flatMap(x=>x.paid.map(n=>'<p>Month '+x.month+': '+esc(n)+' paid off</p>')).join('')||'Add debts to see a projection.')+'<small>Estimate only. Actual interest, due dates and creditor calculations may differ.</small></div>'}else if(page==='fund'){html='<div class="card"><h2>Emergency Fund</h2><p class="big">'+money(db.fund)+'</p><p>Goal: '+money(db.goal)+'</p><progress value="'+Math.min(db.fund,db.goal||1)+'" max="'+(db.goal||1)+'" style="width:100%"></progress><label>Actual fund balance ($)<input id="fundBalance" type="number" min="0" step=".01" value="'+db.fund+'"></label><label>Fund goal ($)<input id="fundGoal" type="number" min="0" step=".01" value="'+db.goal+'"></label><label>Share of each freed debt payment to emergency fund (%)<input id="fundSplit" type="number" min="0" max="100" value="'+db.split+'"></label><button onclick="db.fund=Math.max(0,+fundBalance.value);db.goal=Math.max(0,+fundGoal.value);db.split=Math.max(0,Math.min(100,+fundSplit.value));save()">Save fund settings</button></div>'}else if(page==='settings'){html='<div class="card"><h2>Settings</h2><label>Extra monthly snowball budget ($)<input id="extra" type="number" min="0" step=".01" value="'+db.extra+'"></label><button onclick="db.extra=Math.max(0,+extra.value);save()">Save</button></div><div class="card"><h2>Backup</h2><p>Information is saved only in this browser. Export to back up or move it to another device. It does not sync between phones yet.</p><div class="actions"><button onclick="backup()">Export JSON</button><label style="margin:0">Import JSON<input type="file" accept=".json,application/json" onchange="restore(this.files[0])"></label></div></div>'}screen.innerHTML=html}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='our-finances-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(file){if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.items))throw Error('Invalid backup');if(confirm('Replace all data on this device?')){db=d;save()}}catch(e){alert('Could not import: '+e.message)}}render();
</script></html>
